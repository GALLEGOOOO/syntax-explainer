name: Publicar en Open VSX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas
        run: npm test
      - name: Subir versión
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git add package.json
          [ -f package-lock.json ] && git add package-lock.json || true
          git commit -m "Versión $VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --follow-tags
      - name: Empaquetar
        run: npx --yes @vscode/vsce package -o syntax-explainer.vsix
      - name: Publicar
        run: npx --yes ovsx publish syntax-explainer.vsix -p "${{ secrets.OVSX_PAT }}"
